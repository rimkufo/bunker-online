              <div class="text-sm sm:text-base font-bold text-white">${room.catastrophe.title}</div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <span class="px-2.5 py-1 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-semibold">
                ${aliveCount}/${room.bunkerSlots} мест
              </span>
              <button onclick="state.catastropheExpanded = !state.catastropheExpanded; render();" class="p-2 rounded-lg bg-bunker-card text-bunker-muted">
                <i data-lucide="${state.catastropheExpanded ? 'chevron-up' : 'chevron-down'}" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- Speech Timer Card -->
          <div class="bg-bunker-surface border border-bunker-border rounded-2xl p-3.5 flex items-center justify-between gap-2">
            <div>
              <div class="text-[10px] font-mono uppercase text-bunker-muted">Таймер речи</div>
              <div id="speech-timer-val" class="text-xl font-mono font-extrabold ${room.timer.seconds <= 10 ? 'text-red-400' : 'text-amber-400'}">${formatTime(room.timer.seconds)}</div>
              <div class="text-[11px] text-gray-300 truncate max-w-[120px]">${speaker ? speaker.name : ''}</div>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="openFreeDiceModal()" class="p-2 rounded-lg bg-bunker-card hover:bg-amber-500 hover:text-black border border-bunker-border text-amber-400 transition" title="Бросить кубик (d6/d20/монетка)">
                <i data-lucide="dices" class="w-4 h-4"></i>
              </button>
            ${isHost ? `
              <div class="flex items-center gap-1">
                <button onclick="toggleTimer()" class="p-2 rounded-lg ${room.timer.running ? 'bg-red-500 text-white' : 'bg-amber-500 text-black'} font-bold" title="Старт/Пауза">
                  <i data-lucide="${room.timer.running ? 'pause' : 'play'}" class="w-4 h-4"></i>
                </button>
                <button onclick="resetTimer(60)" class="p-2 rounded-lg bg-bunker-card border border-bunker-border text-gray-300" title="Сброс 60с">
                  <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                </button>
                <button onclick="triggerRandomEvent()" class="p-2 rounded-lg bg-amber-500/15 border border-amber-500/40 text-amber-400 hover:bg-amber-500 hover:text-black transition" title="Случайный рофл / событие">
                  <i data-lucide="zap" class="w-4 h-4"></i>
                </button>
              </div>
            ` : ''}
            </div>
          </div>
        </div>

        ${state.catastropheExpanded ? `
          <div class="bg-bunker-surface border border-bunker-border rounded-2xl p-4 mb-4 space-y-3 text-xs">
            <p class="text-gray-300 leading-relaxed">${room.catastrophe.desc}</p>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
              <div class="p-3 rounded-xl bg-bunker-card border border-bunker-border">
                <div class="text-amber-400 font-semibold mb-1">Бункер: ${room.bunker.area}</div>
                <div class="text-gray-300">${room.bunker.location}</div>
              </div>
              <div class="p-3 rounded-xl bg-bunker-card border border-bunker-border">
                <div class="text-amber-400 font-semibold mb-1">Помещения и еда</div>
                <div class="text-gray-300">${room.bunker.rooms}. ${room.bunker.food}</div>
              </div>
              <div class="p-3 rounded-xl bg-bunker-card border border-bunker-border">
                <div class="text-amber-400 font-semibold mb-1">В бункере есть:</div>
                <ul class="text-gray-300 list-disc list-inside space-y-0.5">
                  ${room.bunker.features.map(f => `<li>${f}</li>`).join("")}
                </ul>
                ${isHost ? `<button onclick="openHostAddBunkerItemModal()" class="mt-2 text-[11px] font-semibold text-amber-400 hover:underline inline-flex items-center gap-1"><i data-lucide="plus" class="w-3 h-3"></i> Добавить предмет</button>` : ''}
              </div>
            </div>
          </div>
        ` : ''}

        ${room.activeEvent ? `
          <div class="mb-4 px-4 py-3 rounded-xl bg-amber-500/10 border border-amber-500/40 flex items-center justify-between gap-3">
            <div class="text-xs sm:text-sm font-medium text-amber-200">${room.activeEvent}</div>
            ${isHost ? `<button onclick="state.room.activeEvent=null; saveRoomLocal(state.room); render();" class="text-amber-400 hover:text-white shrink-0"><i data-lucide="x" class="w-4 h-4"></i></button>` : ''}
          </div>
        ` : ''}

        <!-- Tabs -->
        <div class="grid grid-cols-4 gap-1.5 mb-4 bg-bunker-surface p-1.5 rounded-xl border border-bunker-border">
          <button onclick="state.activeTab='table'; render();" class="py-2.5 px-2 rounded-lg text-xs sm:text-sm font-semibold flex items-center justify-center gap-1.5 transition ${state.activeTab === 'table' ? 'bg-amber-500 text-black' : 'text-bunker-muted hover:text-white'}">
            <i data-lucide="layout-grid" class="w-4 h-4"></i> <span class="hidden sm:inline">Общий стол</span><span class="sm:hidden">Стол</span>
          </button>
          <button onclick="state.activeTab='mycard'; render();" class="py-2.5 px-2 rounded-lg text-xs sm:text-sm font-semibold flex items-center justify-center gap-1.5 transition ${state.activeTab === 'mycard' ? 'bg-amber-500 text-black' : 'text-bunker-muted hover:text-white'}">
            <i data-lucide="id-card" class="w-4 h-4"></i> <span class="hidden sm:inline">Моя карточка</span><span class="sm:hidden">Карта</span>
          </button>
          <button onclick="state.activeTab='vote'; render();" class="py-2.5 px-2 rounded-lg text-xs sm:text-sm font-semibold flex items-center justify-center gap-1.5 transition ${state.activeTab === 'vote' ? 'bg-red-500 text-white' : 'text-bunker-muted hover:text-white'}">
            <i data-lucide="vote" class="w-4 h-4"></i> <span class="hidden sm:inline">Голосование</span><span class="sm:hidden">Голос</span>
          </button>
          <button onclick="state.activeTab='log'; render();" class="py-2.5 px-2 rounded-lg text-xs sm:text-sm font-semibold flex items-center justify-center gap-1.5 transition ${state.activeTab === 'log' ? 'bg-bunker-card text-white border border-bunker-border' : 'text-bunker-muted hover:text-white'}">
            <i data-lucide="scroll-text" class="w-4 h-4"></i> <span class="hidden sm:inline">События</span><span class="sm:hidden">Лог</span>
          </button>
        </div>

        <div class="flex-1">
          ${state.activeTab === "table" ? renderTableTab(participants, isHost) : ""}
          ${state.activeTab === "mycard" ? renderMyCardTab(currentPlayer, localHumans) : ""}
          ${state.activeTab === "vote" ? renderVoteTab(isHost, currentPlayer, participants) : ""}
          ${state.activeTab === "log" ? renderLogTab() : ""}
        </div>
      `;
    }

    function renderTableTab(participants, isHost) {
      const speakerId = state.room.timer.speakerId;

      const desktopTable = `
        <div class="hidden md:block bg-[#0e1116] border border-bunker-border rounded-2xl overflow-hidden shadow-2xl">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse min-w-[1150px]">
              <thead>
                <tr class="border-b border-bunker-border bg-[#131720] text-[11px] font-semibold text-bunker-muted">
                  <th class="sticky left-0 z-20 bg-[#131720] py-3 px-4 border-r border-bunker-border/70 min-w-[210px]">№ Имя</th>
                  ${getActiveTraitMeta(state.room).map(m => `<th class="py-3 px-3 border-r border-bunker-border/50 last:border-r-0 min-w-[130px]">${m.label}</th>`).join("")}
                </tr>
              </thead>
              <tbody class="divide-y divide-bunker-border/60 text-xs">
                ${participants.map((p, idx) => {
                  const char = p.character;
                  const isSpeaking = speakerId === p.id && !p.exiled;
                  const rowBg = p.exiled
                    ? "bg-red-950/20 opacity-50"
                    : (isSpeaking ? "bg-gradient-to-r from-amber-500/15 via-amber-500/5 to-transparent" : "hover:bg-white/[0.02]");
                  const stickyBg = p.exiled
                    ? "bg-[#1a1116]"
                    : (isSpeaking ? "bg-[#1c1a14]" : "bg-[#0e1116]");
                  const initials = p.name.slice(0, 2).toUpperCase();

                  return `
                    <tr class="${rowBg} transition">
                      <td class="sticky left-0 z-10 ${stickyBg} py-3.5 px-4 border-r border-bunker-border/70 align-middle">
                        <div class="flex items-center gap-3">
                          <span class="font-mono text-xs font-bold text-gray-400 w-4 shrink-0">${idx + 1}</span>
                          <div class="w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold shrink-0 border ${isSpeaking ? 'border-amber-400 bg-amber-500/20 text-amber-300 shadow-[0_0_12px_rgba(245,158,11,0.35)]' : 'border-gray-600 bg-bunker-card text-gray-300'}">
                            ${initials}
                          </div>
                          <div class="min-w-0 flex-1">
                            <div class="font-bold text-xs sm:text-sm truncate ${isSpeaking ? 'text-amber-300' : 'text-white'} ${p.exiled ? 'line-through text-red-300' : ''}">
                              ${p.name} ${p.rivalName ? `<span class="ml-1 text-[10px] text-red-400">(⚔️ ${p.rivalName})</span>` : ''}
                            </div>
                            <div class="flex items-center gap-2 mt-0.5 text-[10px]">
                              <span class="${p.exiled ? 'text-red-400' : 'text-bunker-muted'}">${p.exiled ? 'Изгнан' : (p.isHost ? 'Ведущий' : 'Игрок')}</span>
                              ${isHost ? `
                                <button onclick="toggleExileHost('${p.id}')" class="text-gray-400 hover:text-red-400 underline">${p.exiled ? 'вернуть' : 'изгнать'}</button>
                                <button onclick="openHostEditPlayerModal('${p.id}')" class="text-amber-400 hover:text-amber-300 underline">изм.</button>
                                ${!p.exiled ? `<button onclick="setSpeaker('${p.id}')" class="text-emerald-400 hover:text-emerald-300 underline">слово</button>` : ''}
                              ` : ''}
                            </div>
                          </div>
                        </div>
                      </td>
                      ${getActiveTraitMeta(state.room).map(m => {
                        const isRev = char.revealed[m.key];
                        return `
                          <td class="py-3.5 px-3 border-r border-bunker-border/40 last:border-r-0 align-middle">
                            ${isRev
                              ? (() => {
                                  const ab = getTraitAbility(m.key, char.traits[m.key]);
                                  const used = isTraitAbilityUsed(char, m.key);
                                  const badge = ab ? `<span class="mt-1 inline-block px-1.5 py-0.5 rounded text-[10px] font-mono ${used ? 'bg-bunker-card text-bunker-muted' : 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30'}">${used ? '✓ ' + ab.title : '⚡ ' + ab.title}</span>` : '';
                                  return `<span class="text-gray-100 font-medium leading-snug block">${displayTraitText(char.traits[m.key])}</span>${badge}`;
                                })()
                              : `<span class="text-transparent select-none">—</span>`
                            }
                          </td>
                        `;
                      }).join("")}
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;

      const mobileCards = `
        <div class="md:hidden space-y-3">
          ${participants.map((p, idx) => {
            const char = p.character;
            const isSpeaking = speakerId === p.id && !p.exiled;
            const initials = p.name.slice(0, 2).toUpperCase();
            const revealedTraits = getActiveTraitMeta(state.room).filter(m => char.revealed[m.key]);

            return `
              <div class="rounded-2xl p-3.5 border transition ${p.exiled ? 'bg-red-950/15 border-red-500/30 opacity-60' : (isSpeaking ? 'bg-gradient-to-br from-amber-500/15 to-bunker-surface border-amber-500' : 'bg-[#0e1116] border-bunker-border')}">
                <div class="flex items-center justify-between gap-2 mb-2.5">
                  <div class="flex items-center gap-2.5 min-w-0">
                    <span class="font-mono text-xs font-bold text-gray-400">${idx + 1}</span>
                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-[11px] font-bold shrink-0 border ${isSpeaking ? 'border-amber-400 bg-amber-500/20 text-amber-300' : 'border-gray-600 bg-bunker-card text-gray-300'}">
                      ${initials}
                    </div>
                    <div class="min-w-0">
                      <div class="font-bold text-sm truncate ${isSpeaking ? 'text-amber-300' : 'text-white'} ${p.exiled ? 'line-through text-red-300' : ''}">${p.name}</div>
                      <div class="text-[10px] ${p.exiled ? 'text-red-400' : 'text-bunker-muted'}">${p.exiled ? 'Изгнан' : (p.isHost ? 'Ведущий' : 'Игрок')}</div>
                    </div>
                  </div>
                  ${isHost ? `
                    <div class="flex items-center gap-1 shrink-0">
                      ${!p.exiled ? `<button onclick="setSpeaker('${p.id}')" class="p-1.5 rounded-lg bg-bunker-card border border-bunker-border text-emerald-400" title="Слово"><i data-lucide="mic" class="w-3.5 h-3.5"></i></button>` : ''}
                      <button onclick="openHostEditPlayerModal('${p.id}')" class="p-1.5 rounded-lg bg-bunker-card border border-bunker-border text-amber-400" title="Изменить"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                      <button onclick="toggleExileHost('${p.id}')" class="p-1.5 rounded-lg bg-bunker-card border border-bunker-border text-red-400" title="${p.exiled ? 'Вернуть' : 'Изгнать'}"><i data-lucide="${p.exiled ? 'rotate-ccw' : 'user-x'}" class="w-3.5 h-3.5"></i></button>
                    </div>
                  ` : ''}
                </div>

                ${revealedTraits.length > 0 ? `
                  <div class="grid grid-cols-2 gap-1.5 pt-2 border-t border-bunker-border/50">
                    ${revealedTraits.map(m => `
                      <div class="bg-bunker-surface/80 rounded-lg px-2.5 py-1.5 border border-bunker-border/40">
                        <div class="text-[10px] text-bunker-muted">${m.label}</div>
                        <div class="text-xs text-gray-100 font-medium leading-tight mt-0.5">${displayTraitText(char.traits[m.key])}</div>
                        ${(() => {
                          const ab = getTraitAbility(m.key, char.traits[m.key]);
                          if (!ab) return "";
                          const used = isTraitAbilityUsed(char, m.key);
                          return `<span class="mt-1 inline-block px-1.5 py-0.5 rounded text-[9px] font-mono ${used ? 'bg-bunker-card text-bunker-muted' : 'bg-emerald-500/15 text-emerald-300'}">${used ? '✓ ' + ab.title : '⚡ ' + ab.title}</span>`;
                        })()}
                      </div>
                    `).join("")}
                  </div>
                ` : `
                  <div class="text-[11px] text-gray-500 font-mono pt-1.5 border-t border-bunker-border/40">Все карты пока скрыты</div>
                `}
              </div>
            `;
          }).join("")}
        </div>
      `;

      return desktopTable + mobileCards;
    }

    function renderMyCardTab(player, localHumans) {
      if (!player || !player.character) {
        return `
          <div class="bg-bunker-surface border border-bunker-border rounded-2xl p-8 text-center">
            <i data-lucide="crown" class="w-10 h-10 text-amber-400 mx-auto mb-3"></i>
            <h3 class="text-lg font-bold text-white mb-1">Вы — Ведущий игры</h3>
            <p class="text-sm text-bunker-muted">Управляйте таймером речи, голосованием и карточками игроков на вкладке «Общий стол».</p>
          </div>
        `;
      }

      const char = player.character;
      const switcherHtml = localHumans.length > 1 ? `
        <div class="mb-4 p-3 rounded-xl bg-bunker-surface border border-bunker-border flex flex-wrap items-center justify-between gap-2">
          <div class="text-xs text-bunker-muted">Игрок:</div>
          <div class="flex flex-wrap gap-1.5">
            ${localHumans.map(lh => `
              <button onclick="state.viewingPlayerId='${lh.id}'; state.privacyShield=true; render();" class="px-3 py-1 rounded-lg text-xs font-semibold border ${lh.id === player.id ? 'bg-amber-500 text-black border-amber-500' : 'bg-bunker-card text-gray-300 border-bunker-border'}">${lh.name}</button>
            `).join("")}
          </div>
        </div>
      ` : '';

      if (state.privacyShield) {
        return `${switcherHtml}
          <div class="bg-bunker-surface border border-bunker-border rounded-2xl p-8 text-center">
            <i data-lucide="eye-off" class="w-10 h-10 text-amber-400 mx-auto mb-3"></i>
            <h3 class="text-lg font-bold text-white mb-1">Карточка скрыта</h3>
            <p class="text-sm text-bunker-muted mb-5">Передайте экран игроку <strong class="text-white">${player.name}</strong></p>
            <button onclick="state.privacyShield=false; render();" class="px-6 py-3 rounded-xl bg-amber-500 text-black font-bold text-sm">Показать карточку</button>
          </div>`;
      }

      if (player.exiled) {
        return `${switcherHtml}
          <div class="bg-red-950/30 border border-red-500/30 rounded-2xl p-6 text-center">
            <i data-lucide="skull" class="w-10 h-10 text-red-400 mx-auto mb-2"></i>
            <h3 class="text-lg font-bold text-red-300">${player.name} — Изгнан</h3>
          </div>`;
      }

      const traitsHtml = getActiveTraitMeta(state.room).map(meta => {
        const val = char.traits[meta.key];
        const isRev = char.revealed[meta.key];
        return `
          <div class="p-3.5 rounded-xl border flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${isRev ? 'bg-emerald-950/20 border-emerald-500/30' : 'bg-bunker-card border-bunker-border'}">
            <div class="flex items-start gap-3">
              <div class="p-2 rounded-lg bg-bunker-bg border border-bunker-border text-amber-400 shrink-0 mt-0.5"><i data-lucide="${meta.icon}" class="w-4 h-4"></i></div>
              <div>
                <div class="text-[11px] uppercase tracking-wider font-semibold text-bunker-muted">${meta.label} ${isRev ? '<span class="text-emerald-400">• Открыто</span>' : '<span class="text-gray-500">• Скрыто</span>'}</div>
                <div class="text-sm font-semibold text-white mt-0.5">${displayTraitText(val)}</div>
              </div>
            </div>
            <div class="flex flex-wrap items-center gap-1.5 shrink-0">
              ${(() => {
                const ab = getTraitAbility(meta.key, val);
                const used = isTraitAbilityUsed(char, meta.key);
                if (!ab) return "";
                if (used) return '<span class="px-2.5 py-1 rounded-lg bg-bunker-bg border border-bunker-border text-bunker-muted text-[11px] font-mono">Навык исп.</span>';
                return `<button onclick="useTraitAbility('${player.id}', '${meta.key}')" class="px-3 py-2 rounded-xl bg-emerald-500/15 hover:bg-emerald-500 hover:text-black border border-emerald-500/40 text-emerald-300 text-xs font-bold transition" title="${ab.desc}">⚡ ${ab.title}</button>`;
              })()}
              ${!isRev
                ? `<button onclick="revealTrait('${player.id}', '${meta.key}')" class="px-4 py-2 rounded-xl bg-amber-500/15 hover:bg-amber-500 hover:text-black border border-amber-500/40 text-amber-300 text-xs font-bold transition">Открыть</button>`
                : `<span class="px-3 py-1 rounded-lg bg-emerald-500/10 text-emerald-400 text-xs font-mono text-center">На столе</span>`
              }
            </div>
          </div>
        `;
      }).join("");

      const specialsHtml = char.specials.map((sp, idx) => `
        <div class="p-4 rounded-xl border ${sp.used ? 'bg-bunker-bg border-bunker-border opacity-50' : 'bg-amber-500/5 border-amber-500/30'} flex flex-col justify-between gap-3">
          <div>
            <div class="text-xs font-mono uppercase text-amber-400 mb-1">Спец. возможность ${idx + 1}</div>
            <div class="text-sm font-bold text-white mb-1">${sp.title}</div>
            <div class="text-xs text-gray-300">${sp.desc}</div>
          </div>
          ${!sp.used
            ? `<button onclick="useSpecialCard('${player.id}', ${idx})" class="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs">Использовать</button>`
            : `<div class="text-center text-xs font-mono text-bunker-muted">Использовано</div>`
          }
        </div>
      `).join("");

      return `
        ${switcherHtml}
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-2.5 mb-6">${traitsHtml}</div>
        <h3 class="text-sm font-bold uppercase tracking-wider text-bunker-muted mb-3">Специальные возможности</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${specialsHtml}</div>
      `;
    }

    function renderVoteTab(isHost, currentPlayer, participants) {
      const room = state.room;
      const alive = participants.filter(p => !p.exiled);
      const votedCount = Object.keys(room.voting.votes).length;
      const myVote = currentPlayer ? room.voting.votes[currentPlayer.id] : null;

      if (!room.voting.active) {
        return `
          <div class="bg-bunker-surface border border-bunker-border rounded-2xl p-6 text-center space-y-4">
            <i data-lucide="gavel" class="w-10 h-10 text-amber-400 mx-auto"></i>
            <div>
              <h3 class="text-lg font-bold text-white">Фаза обсуждения</h3>
              <p class="text-sm text-bunker-muted mt-1">Открывайте карты, используйте таймер речи и убеждайте остальных.</p>
            </div>
            ${room.voting.lastResult ? `<div class="p-3 rounded-xl bg-bunker-card border border-bunker-border text-xs text-amber-300">${room.voting.lastResult}</div>` : ''}
            ${isHost ? `
              <button onclick="startVoting()" class="px-8 py-4 rounded-xl bg-red-500 hover:bg-red-400 text-white font-bold text-base inline-flex items-center gap-2">
                <i data-lucide="vote" class="w-5 h-5"></i> Запустить голосование
              </button>
            ` : `<div class="text-xs text-bunker-muted">Ожидайте запуска голосования ведущим.</div>`}
          </div>
        `;
      }

      const counts = {};
      Object.values(room.voting.votes).forEach(tid => { counts[tid] = (counts[tid] || 0) + 1; });

      return `
        <div class="bg-bunker-surface border border-bunker-border rounded-2xl p-4 sm:p-5 space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-bold text-white">Голосование на изгнание</h3>
            <span class="text-xs text-bunker-muted">Проголосовало: ${votedCount}/${alive.length}</span>
          </div>
          <div class="space-y-2">
            ${alive.map(c => {
              const isSelected = myVote === c.id;
              const canVote = currentPlayer && !currentPlayer.exiled && c.id !== currentPlayer.id && (room.hostPlays || CLIENT_ID !== room.hostId);
              return `
                <div class="p-3.5 rounded-xl border flex items-center justify-between gap-3 ${isSelected ? 'bg-red-500/15 border-red-500' : 'bg-bunker-card border-bunker-border'}">
                  <div>
                    <div class="text-sm font-bold text-white">${c.name}</div>
                    <div class="text-xs text-bunker-muted">${c.character.revealed.profession ? c.character.traits.profession : 'Профессия скрыта'} • Голосов: <strong class="text-white">${counts[c.id] || 0}</strong></div>
                  </div>
                  ${canVote ? `<button onclick="castVote('${currentPlayer.id}', '${c.id}')" class="px-4 py-2 rounded-xl text-xs font-bold ${isSelected ? 'bg-red-500 text-white' : 'bg-bunker-bg border border-bunker-border text-gray-200'}">${isSelected ? 'Выбран' : 'Против'}</button>` : `<span class="text-xs text-bunker-muted">—</span>`}
                </div>
              `;
            }).join("")}
          </div>
          ${isHost ? `<button onclick="finishVoting()" class="w-full py-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold text-sm">Завершить голосование</button>` : ''}
        </div>
      `;
    }

    function renderLogTab() {
      return `
        <div class="bg-bunker-surface border border-bunker-border rounded-2xl p-4 space-y-2 max-h-[60vh] overflow-y-auto">
          ${state.room.log.map(entry => `
            <div class="text-xs text-gray-300 py-2 border-b border-bunker-border/40 last:border-0">${entry}</div>
          `).join("")}
        </div>
      `;
    }

    const SURVIVAL_QUESTIONS = [
      "У вас хватает еды на весь период (включая отыгрыш добычи еды)?",
      "Все опасные заразные выжившие изолированы?",
      "Хотя бы половина выживших — не инвалиды?",
      "Хотя бы половина выживших — не хрупкие и без ожирения?",
      "У большинства нет критически отрицательной человеческой черты?",
      "Есть хотя бы пара человек с полезной профессией?",
      "Есть хотя бы пара человек с полезным хобби?",
      "Есть люди с полезным инвентарём (рюкзак или большой багаж)?",
      "Есть хотя бы пара человек с полезными доп. сведениями?",
      "Есть хотя бы одна пара для продолжения рода?",
      "Проблемы в бункере отсутствуют или полностью решены?"
    ];

    function openSurvivalTestModal() {
      state.survivalTest = { step: 0, answers: [], finished: false };
      renderSurvivalModal();
    }

    function answerSurvivalQuestion(isYes) {
      state.survivalTest.answers.push(isYes);
      if (state.survivalTest.step + 1 < SURVIVAL_QUESTIONS.length) {
        state.survivalTest.step += 1;
      } else {
        state.survivalTest.finished = true;
      }
      renderSurvivalModal();
    }

    function renderSurvivalModal() {
      const st = state.survivalTest;
      if (!st.finished) {
        const q = SURVIVAL_QUESTIONS[st.step];
        openModal(`
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-base font-bold text-white flex items-center gap-2">
              <i data-lucide="clipboard-check" class="w-5 h-5 text-amber-400"></i>
              Оценка выживаемости (${st.step + 1}/${SURVIVAL_QUESTIONS.length})
            </h3>
            <button onclick="closeModal()" class="text-bunker-muted hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <div class="w-full bg-bunker-bg h-1.5 rounded-full mb-5 overflow-hidden">
            <div class="bg-amber-500 h-full transition-all" style="width: ${Math.round(((st.step + 1) / SURVIVAL_QUESTIONS.length) * 100)}%"></div>
          </div>
          <p class="text-base font-semibold text-white mb-6 leading-relaxed">${q}</p>
          <div class="grid grid-cols-2 gap-3">
            <button onclick="answerSurvivalQuestion(true)" class="py-3.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-sm transition">Да</button>
            <button onclick="answerSurvivalQuestion(false)" class="py-3.5 rounded-xl bg-red-500/20 hover:bg-red-500/30 border border-red-500/40 text-red-300 font-bold text-sm transition">Нет</button>
          </div>
        `);
      } else {
        const yesCount = st.answers.filter(Boolean).length;
        const pct = Math.round((yesCount / SURVIVAL_QUESTIONS.length) * 100);
        let verdict = "Бункер обречён... Но было весело!";
        let color = "text-red-400";
        if (pct >= 75) { verdict = "Поздравляем! Всем жителям удалось выжить, и именно ваша база станет началом новой цивилизации в будущем!"; color = "text-emerald-400"; }
        else if (pct >= 50) { verdict = "Выжили на тоненького — придётся сильно постараться!"; color = "text-amber-400"; }

        openModal(`
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-bold text-white">Итог оценки бункера</h3>
            <button onclick="closeModal()" class="text-bunker-muted hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <div class="text-center py-4">
            <div class="text-5xl font-mono font-extrabold ${color} mb-2">${pct}%</div>
            <div class="text-base font-bold text-white mb-2">${verdict}</div>
            <p class="text-xs text-bunker-muted">Положительных ответов: ${yesCount} из ${SURVIVAL_QUESTIONS.length}</p>
          </div>
          <button onclick="closeModal()" class="mt-4 w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold text-sm">Закрыть</button>
        `);
      }
    }

    function renderGameOver() {
      const room = state.room;
      const participants = getPlayingParticipants(room);
      const survivors = participants.filter(p => !p.exiled);
      const exiled = participants.filter(p => p.exiled);

      return `
        <div class="py-4 space-y-6">
          <div class="hazard-stripe border border-emerald-500/40 rounded-2xl p-6 text-center">
            <i data-lucide="shield-check" class="w-12 h-12 text-emerald-400 mx-auto mb-3"></i>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">Двери бункера закрыты!</h1>
            <p class="text-sm text-gray-300">Катастрофа «${room.catastrophe.title}» пережита. В бункер (${room.bunker.area}) прошли ${survivors.length} чел.</p>
          </div>
          <div>
            <h2 class="text-sm font-bold uppercase tracking-wider text-emerald-400 mb-3">Попали в бункер (${survivors.length})</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">${survivors.map(p => renderFinalCard(p, true)).join("")}</div>
          </div>
          ${exiled.length > 0 ? `
            <div>
              <h2 class="text-sm font-bold uppercase tracking-wider text-red-400 mb-3">Остались снаружи (${exiled.length})</h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 opacity-75">${exiled.map(p => renderFinalCard(p, false)).join("")}</div>
            </div>
          ` : ''}
          <div class="flex flex-col sm:flex-row gap-3">
            <button onclick="openSurvivalTestModal()" class="flex-1 py-4 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-black font-bold flex items-center justify-center gap-2 transition">
              <i data-lucide="clipboard-check" class="w-5 h-5"></i>
              Оценка выживаемости бункера
            </button>
            ${room.hostId === CLIENT_ID ? `<button onclick="startGame()" class="py-4 px-6 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold transition">Сыграть ещё раз</button>` : ''}
            <button onclick="leaveToHome()" class="py-4 px-6 rounded-xl bg-bunker-surface border border-bunker-border text-white font-semibold">В главное меню</button>
          </div>
        </div>
      `;
    }

    function renderFinalCard(p, survived) {
      return `
        <div class="rounded-2xl p-4 border ${survived ? 'bg-bunker-surface border-emerald-500/40' : 'bg-bunker-surface border-red-500/30'}">
          <div class="font-bold text-base text-white mb-2 flex items-center justify-between">
            <span>${p.name}</span>
            <span class="text-xs font-mono ${survived ? 'text-emerald-400' : 'text-red-400'}">${survived ? 'ВЫЖИЛ' : 'ИЗГНАН'}</span>
          </div>
          <div class="space-y-1 text-xs">
            ${getActiveTraitMeta(state.room).map(m => `
              <div class="flex justify-between gap-2 border-b border-bunker-border/40 py-1 last:border-0">
                <span class="text-bunker-muted">${m.label}:</span>
                <span class="text-gray-200 text-right">${p.character.traits[m.key]}</span>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    let pollInterval = null;
    let gameClockInterval = null;
    let lastAutoEventAt = 0;
    function startGameClock() {
      if (gameClockInterval) clearInterval(gameClockInterval);
      gameClockInterval = setInterval(() => {
        if (!state.room || !state.room.startedAt || state.room.phase === "gameover" || state.room.phase === "lobby") return;
        const el = document.getElementById("game-duration-val");
        if (el) el.textContent = formatElapsed(Date.now() - state.room.startedAt);
        // Автоматическое случайное событие раз в ~105 секунд во время активной игры (запускает хост)
        if (state.room.hostId === CLIENT_ID && state.room.phase === "playing") {
          const now = Date.now();
          if (!lastAutoEventAt) lastAutoEventAt = state.room.startedAt;
          if (now - lastAutoEventAt >= 105000) {
            lastAutoEventAt = now;
            triggerRandomEvent(true);
          }
        }
      }, 1000);
    }

    function startRoomPolling() {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(async () => {
        if (!state.room || !supabaseClient) return;
        const remote = await fetchRoomFromSupabase(state.room.code);
        if (remote && JSON.stringify(remote) !== JSON.stringify(state.room)) {
          state.room = remote;
          if (remote.phase === "playing" || remote.phase === "voting") state.screen = "game";
          if (remote.phase === "gameover") state.screen = "gameover";
          render();
        }
      }, 3000);
    }

    function applyRestoredRoom(room) {
      if (!room || !room.players || !room.players.find(p => p.id === CLIENT_ID)) return false;
      state.room = room;
      state.viewingPlayerId = CLIENT_ID;
      state.screen = room.phase === "lobby" ? "lobby" : (room.phase === "gameover" ? "gameover" : "game");
      return true;
    }

    window.addEventListener("DOMContentLoaded", async () => {
      let savedCode = "";
      try {
        savedCode = sessionStorage.getItem(STORAGE_KEY_ACTIVE_ROOM) || "";
        state.playerName = sessionStorage.getItem(STORAGE_KEY_PLAYER_NAME) || "";
      } catch (e) {}

      if (savedCode) {
        const localRoom = loadRoomLocal(savedCode);
        if (localRoom) applyRestoredRoom(localRoom);
      }
      render();

      await initSupabaseIfConfigured();
      if (savedCode && supabaseClient) {
        const remoteRoom = await fetchRoomFromSupabase(savedCode);
        if (remoteRoom && applyRestoredRoom(remoteRoom)) {
          subscribeSupabaseRoom(savedCode);
          render();
        }
      }
      await loadPacksFromSupabase();
      startRoomPolling();
      startGameClock();
    });
  </script>
</body>
</html>
