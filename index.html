    async function initSupabaseIfConfigured() {
      if (!state.supabaseCfg.url || !state.supabaseCfg.key) return;
      if (!window.supabase) {
        await new Promise((resolve) => {
          const s = document.createElement("script");
          s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js";
          s.onload = resolve;
          s.onerror = resolve;
          document.head.appendChild(s);
        });
      }
      if (window.supabase) {
        try {
          supabaseClient = window.supabase.createClient(state.supabaseCfg.url, state.supabaseCfg.key);
        } catch (e) {
          supabaseClient = null;
        }
      }
    }

    async function syncRoomToSupabase(room) {
      if (!supabaseClient) return;
      try {
        const { error } = await supabaseClient
          .from("bunker_rooms")
          .upsert({ code: room.code, state: room, updated_at: new Date().toISOString() }, { onConflict: "code" });
        if (error) {
          showToast("Ошибка Supabase: " + error.message, "error");
        }
      } catch (e) {
        showToast("Нет связи с Supabase", "error");
      }
    }

    async function fetchRoomFromSupabase(code) {
      if (!supabaseClient) return null;
      try {
        const { data, error } = await supabaseClient.from("bunker_rooms").select("state").eq("code", code).single();
        if (!error && data && data.state) return data.state;
      } catch (e) {}
      return null;
    }

    async function syncPackToSupabase(pack) {
      if (!supabaseClient) return false;
      try {
        const { error } = await supabaseClient
          .from("bunker_rooms")
          .upsert({ code: "PACK__" + pack.id, state: pack, updated_at: new Date().toISOString() }, { onConflict: "code" });
        if (error) {
          showToast("Ошибка сохранения пака в облако: " + error.message, "error");
          return false;
        }
        return true;
      } catch (e) {
        return false;
      }
    }

    async function deletePackFromSupabase(packId) {
      if (!supabaseClient) return;
      try {
        await supabaseClient.from("bunker_rooms").delete().eq("code", "PACK__" + packId);
      } catch (e) {}
    }

    async function loadPacksFromSupabase() {
      if (!supabaseClient) return;
      try {
        const { data, error } = await supabaseClient
          .from("bunker_rooms")
          .select("state")
          .like("code", "PACK__%");
        if (!error && Array.isArray(data)) {
          const map = new Map();
          state.customPacks.forEach(p => map.set(p.id, p));
          data.forEach(row => {
            if (row && row.state && row.state.id) {
              map.set(row.state.id, { ...row.state, syncedCloud: true });
            }
          });
          state.customPacks = Array.from(map.values());
          saveCustomPacks(state.customPacks);
          render();
        }
      } catch (e) {}
    }

    function subscribeSupabaseRoom(code) {
      if (!supabaseClient) return;
      if (supabaseChannel) {
        try { supabaseClient.removeChannel(supabaseChannel); } catch (e) {}
      }
      supabaseChannel = supabaseClient
        .channel("room_" + code)
        .on("postgres_changes", { event: "*", schema: "public", table: "bunker_rooms", filter: `code=eq.${code}` }, (payload) => {
          if (payload.new && payload.new.state) {
            state.room = payload.new.state;
            if (state.room.phase === "playing" || state.room.phase === "voting") state.screen = "game";
            if (state.room.phase === "gameover") state.screen = "gameover";
            render();
          }
        })
        .subscribe();
    }

    function pickMultiple(arr, count) {
      const copy = [...arr];
      const res = [];
      for (let i = 0; i < count && copy.length > 0; i++) {
        const idx = Math.floor(Math.random() * copy.length);
        res.push(copy.splice(idx, 1)[0]);
      }
      return res;
    }

      const container = document.getElementById("toast-container");

      const colors = {

        success: "bg-emerald-950/90 border-emerald-500/40 text-emerald-200",
        warn: "bg-amber-950/90 border-amber-500/40 text-amber-200",
        error: "bg-red-950/90 border-red-500/40 text-red-200"
      };
      el.className = `pointer-events-auto px-4 py-3 rounded-xl border text-sm font-medium shadow-xl transition-all duration-300 ${colors[type] || colors.info}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {

      }, 3000);

        ? window.location.origin + window.location.pathname
        : "";
      if (!base) {
        copyText(code);
        return;
      }
      copyText(`${base}?room=${code}`);
    }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast("Скопировано: " + text, "success")).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        showToast("Скопировано: " + text, "success");
      } catch (e) {
        showToast("Код: " + text, "info");
      }
      ta.remove();
    }

    function toggleBaseExcludeItem(key, idx) {
      const p = state.editingPack;
      if (!p.excludedBase) p.excludedBase = {};
      const item = getBasePoolForKey(key)[idx];
      const arr = p.excludedBase[key] || [];
      const pos = arr.indexOf(item);
      if (pos >= 0) arr.splice(pos, 1);
      else arr.push(item);
      p.excludedBase[key] = arr;
    }

    function toggleAllBaseExclude(key, excludeAll) {
      const p = state.editingPack;

    function generateDefaultGender() {
      const g = pick(DECKS.genders);
      const age = Math.floor(18 + Math.random() * 48);
      const cfChance = (customPack && customPack.childfreeChance != null) ? (customPack.childfreeChance / 100) : 0.20;
        const cf = Math.random() < cfChance ? " (чайлдфри)" : "";
      return `${g}, ${age} лет${cf}`;
    }

    function generateDefaultBody() {
      return `${pick(BODY_TYPES)}, ${Math.floor(155 + Math.random() * 42)} см`;
    }

    function generateDefaultHealth() {
      const cond = pick(DECKS.healthConditions);
      if (cond.includes("Полностью здоров") || cond.includes("иммунитет") || cond.includes("Глухонемой") || cond.includes("Слепой")) return cond;
      const deg = pick(HEALTH_DEG);
      if (ZONE_DISEASES.some(zd => cond.toLowerCase().includes(zd.toLowerCase()))) {
        return `${cond} (Область: ${pick(BODY_ZONES)}, ${deg})`;
      }
      return cond.includes("(") ? cond : `${cond} (${deg})`;
    }

    function randInt(min, max) {
      return Math.floor(min + Math.random() * (max - min + 1));
    }

    function createCharacter(customPack, sessionExcluded = {}) {
      const pickRaw = (key, baseArr) => {
        const sessEx = (sessionExcluded && sessionExcluded[key]) ? sessionExcluded[key] : [];
        const customPool = (customPack && customPack.traits && customPack.traits[key]) ? customPack.traits[key].filter(x => !sessEx.includes(x)) : [];
        if (customPack && (customPack.onlyCustom || (customPack.disableBase && customPack.disableBase[key]))) {
          return customPool.length > 0 ? pick(customPool) : "Не указано";
        }
        const excluded = (customPack && customPack.excludedBase && customPack.excludedBase[key]) ? customPack.excludedBase[key] : [];
        const filteredBase = baseArr.filter(x => !excluded.includes(x) && !sessEx.includes(x));
        const combined = [...customPool, ...filteredBase];
        return combined.length > 0 ? pick(combined) : "Не указано";
      };

      const useAge = customPack ? (customPack.useAgeRange !== false) : true;
      const ageMin = (customPack && customPack.ageMin != null) ? customPack.ageMin : 18;
      const ageMax = (customPack && customPack.ageMax != null) ? customPack.ageMax : 65;
      let genderVal = pickRaw("gender", DECKS.genders);
      if (useAge && genderVal !== "Не указано") {
        const cf = Math.random() < 0.15 ? " (чайлдфри)" : "";
        genderVal = `${genderVal}, ${randInt(ageMin, ageMax)} лет${cf}`;
      }

      const useHeight = customPack ? (customPack.useHeightRange !== false) : true;
      const hMin = (customPack && customPack.heightMin != null) ? customPack.heightMin : 155;
      const hMax = (customPack && customPack.heightMax != null) ? customPack.heightMax : 196;
      let bodyVal = pickRaw("body", BODY_TYPES);
      if (useHeight && bodyVal !== "Не указано") {
        bodyVal = `${bodyVal}, ${randInt(hMin, hMax)} см`;
      }

      const useProfExp = customPack ? (customPack.useProfExp !== false) : true;
      const profExpPool = (customPack && customPack.customProfExp && customPack.customProfExp.length > 0) ? customPack.customProfExp : PROF_EXP;
      let profVal = pickRaw("profession", DECKS.professions);
      if (useProfExp && profVal !== "Не указано") profVal = `${profVal} (${pick(profExpPool)})`;

      const useHealthDeg = customPack ? (customPack.useHealthDeg !== false) : true;
      const healthDegPool = (customPack && customPack.customHealthDeg && customPack.customHealthDeg.length > 0) ? customPack.customHealthDeg : HEALTH_DEG;
      let healthVal = pickRaw("health", DECKS.healthConditions);
      if (healthVal !== "Не указано" && !healthVal.includes("Полностью здоров") && !healthVal.includes("иммунитет") && !healthVal.includes("Глухонемой") && !healthVal.includes("Слепой")) {
        const hasZone = ZONE_DISEASES.some(zd => healthVal.toLowerCase().includes(zd.toLowerCase()));
        const degText = useHealthDeg ? pick(healthDegPool) : "";
        if (hasZone) {
          const zone = pick(BODY_ZONES);
          healthVal = degText ? `${healthVal} (Область: ${zone}, ${degText})` : `${healthVal} (Область: ${zone})`;
        } else if (degText && !healthVal.includes("(")) {
          healthVal = `${healthVal} (${degText})`;
        }
      }

      const useHobbyExp = customPack ? (customPack.useHobbyExp !== false) : true;
      const hobbyExpPool = (customPack && customPack.customHobbyExp && customPack.customHobbyExp.length > 0) ? customPack.customHobbyExp : HOBBY_EXP;
      let hobbyVal = pickRaw("hobby", DECKS.hobbies);
      if (useHobbyExp && hobbyVal !== "Не указано") hobbyVal = `${hobbyVal} (${pick(hobbyExpPool)})`;

      const revealed = {};
      TRAIT_META.forEach(m => { revealed[m.key] = false; });

      return {
        traits: {
          gender: genderVal,
          body: bodyVal,
          trait: pickRaw("trait", DECKS.characterTraits),
          profession: profVal,
          health: healthVal,
          hobby: hobbyVal,
          phobia: pickRaw("phobia", DECKS.phobias),
          backpack: pickRaw("backpack", DECKS.backpack),
          bigLuggage: pickRaw("bigLuggage", DECKS.bigLuggage),
          fact: pickRaw("fact", DECKS.facts)
        },
        revealed,
        traitAbilitiesUsed: {},
        profAbilityUsed: false,
        hobbyAbilityUsed: false,
        specials: pickMultiple(DECKS.specialCards, 2).map(s => ({ ...s, used: false }))
      };
    }

    async function createRoom(isQuickDemo = false) {
      if (!supabaseClient && state.supabaseCfg.url && state.supabaseCfg.key) { await initSupabaseIfConfigured(); }
      const nameInput = document.getElementById("input-player-name");
      const name = (nameInput ? nameInput.value.trim() : "") || state.playerName || "Выживший";
      state.playerName = name;

      const code = generateRoomCode();
      const players = [{
        id: CLIENT_ID,
        name,
        isHost: true,
        isBot: false,
        isLocal: false,
        exiled: false,
        immunity: false,
        doubleVote: false,
        character: null
      }];

      if (isQuickDemo) {
        pickMultiple(BOT_NAMES, 5).forEach((bn, idx) => {
          players.push({
            id: "bot_" + idx + "_" + Math.random().toString(36).slice(2, 6),
            name: bn + " (Бот)",
            isHost: false,
            isBot: true,
            isLocal: false,
            exiled: false,
            immunity: false,
            doubleVote: false,
            character: null
          });
        });
      }

      const room = {
        code,
        hostId: CLIENT_ID,
        hostPlays: true, // true = играет с карточкой, false = только ведущий
        selectedPackId: "base",
        disabledTraits: [],
        sessionExcluded: {},
        phase: "lobby",
        round: 1,
        startedAt: null,
        eventPool: null,
        maxPlayers: 12,
        bunkerSlots: Math.max(1, Math.floor(players.length / 2)),
        catastrophe: null,
        bunker: null,
        players,
        timer: { seconds: 60, running: false, speakerId: null },
        activeEvent: null,
        voting: { active: false, votes: {}, lastResult: null },
        log: [`Комната ${code} создана. Ведущий: ${name}.`]
      };

      state.room = room;
      state.viewingPlayerId = CLIENT_ID;
      state.screen = "lobby";
      try { sessionStorage.setItem(STORAGE_KEY_ACTIVE_ROOM, room.code); sessionStorage.setItem(STORAGE_KEY_PLAYER_NAME, state.playerName); } catch (e) {}
      saveRoomLocal(room);
      subscribeSupabaseRoom(code);

      if (isQuickDemo) {
        startGame();
        showToast("Тест-матч с ботами запущен!", "success");
      } else {
        showToast(`Комната ${code} создана`, "success");
        render();
      }
    }

    async function joinRoom() {
      if (!supabaseClient && state.supabaseCfg.url && state.supabaseCfg.key) { await initSupabaseIfConfigured(); }
      const nameEl = document.getElementById("input-player-name");
      const codeEl = document.getElementById("input-room-code");
      const name = (nameEl ? nameEl.value.trim() : "") || "Выживший";
      const code = (codeEl ? codeEl.value.trim() : "");

      if (!/^\d{4}$/.test(code)) {
        showToast("Введите 4-значный код комнаты", "warn");
        return;
      }

      state.playerName = name;
      let room = loadRoomLocal(code);
      if (!room && supabaseClient) room = await fetchRoomFromSupabase(code);

      if (!room) {
        showToast(`Комната ${code} не найдена`, "error");
        return;
      }

      if (!room.players.find(p => p.id === CLIENT_ID)) {
        if (room.phase !== "lobby") {
          showToast("Игра уже началась", "warn");
          return;
        }
        const limit = room.maxPlayers || 12;
        if (room.players.length >= limit) {
          showToast(`Комната заполнена (максимум ${limit} чел.)`, "warn");
          return;
        }
        room.players.push({
          id: CLIENT_ID,
          name,
          isHost: false,
          isBot: false,
          isLocal: false,
          exiled: false,
          immunity: false,
          doubleVote: false,
          character: null
        });
        room.bunkerSlots = Math.max(1, Math.floor(room.players.length / 2));
        room.log.unshift(`${name} вошёл в комнату.`);
        saveRoomLocal(room);
      }

      state.room = room;
      state.viewingPlayerId = CLIENT_ID;
      state.screen = room.phase === "lobby" ? "lobby" : (room.phase === "gameover" ? "gameover" : "game");
      try { sessionStorage.setItem(STORAGE_KEY_ACTIVE_ROOM, room.code); sessionStorage.setItem(STORAGE_KEY_PLAYER_NAME, state.playerName); } catch (e) {}
      subscribeSupabaseRoom(code);
      render();
    }

    function toggleHostPlays() {
      if (!state.room || state.room.hostId !== CLIENT_ID) return;
      state.room.hostPlays = !state.room.hostPlays;
      saveRoomLocal(state.room);
      render();
    }

    function addBotOrLocalPlayer(isBot) {
      if (!state.room || state.room.phase !== "lobby") return;
      const limit = state.room.maxPlayers || 12;
      if (state.room.players.length >= limit) {
        showToast(`Достигнут лимит комнаты (${limit} игроков)`, "warn");
        return;
      }
      const usedNames = new Set(state.room.players.map(p => p.name.replace(" (Бот)", "")));
      const available = BOT_NAMES.filter(n => !usedNames.has(n));
      const baseName = available.length > 0 ? pick(available) : `Игрок ${state.room.players.length + 1}`;
      state.room.players.push({
        id: (isBot ? "bot_" : "loc_") + Math.random().toString(36).substring(2, 8),
        name: isBot ? `${baseName} (Бот)` : baseName,
        isHost: false,
        isBot,
        isLocal: !isBot,
        exiled: false,
        immunity: false,
        doubleVote: false,
        character: null
      });
      state.room.bunkerSlots = Math.max(1, Math.floor(state.room.players.length / 2));
      saveRoomLocal(state.room);
      render();
    }

    function removePlayer(playerId) {
      if (!state.room || state.room.phase !== "lobby" || playerId === state.room.hostId) return;
      state.room.players = state.room.players.filter(p => p.id !== playerId);
      state.room.bunkerSlots = Math.max(1, Math.floor(state.room.players.length / 2));
      saveRoomLocal(state.room);
      render();
    }

    function adjustSlots(delta) {
      if (!state.room) return;
      const activeCount = state.room.players.filter(p => state.room.hostPlays || !p.isHost).length;
      const maxSlots = Math.max(1, activeCount - 1);
      state.room.bunkerSlots = Math.min(maxSlots, Math.max(1, state.room.bunkerSlots + delta));
      saveRoomLocal(state.room);
      render();
    }

    function adjustMaxPlayers(delta) {
      if (!state.room || state.room.hostId !== CLIENT_ID) return;
      const minAllowed = Math.max(3, state.room.players.length);
      const cur = state.room.maxPlayers || 12;
      state.room.maxPlayers = Math.min(20, Math.max(minAllowed, cur + delta));
      saveRoomLocal(state.room);
      render();
    }

      const dis = (room && room.disabledTraits) ? room.disabledTraits : [];
      return TRAIT_META.filter(m => !dis.includes(m.key));

          <div class="text-xs font-semibold text-bunker-muted mb-2">1. Какие характеристики включены в этой игре:</div>
          <div class="grid grid-cols-2 gap-1.5">
            ${TRAIT_META.map(m => {
              const isOn = !room.disabledTraits.includes(m.key);
              return `
                <label class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg bg-bunker-bg border border-bunker-border/70 text-xs text-gray-200 cursor-pointer">
                  <input type="checkbox" ${isOn ? 'checked' : ''} onchange="toggleLobbyTrait('${m.key}')" class="rounded bg-bunker-card border-bunker-border text-amber-500">
                  <span class="truncate">${m.label}</span>
                </label>
              `;
            }).join("")}
          </div>
        </div>

        <div class="border-t border-bunker-border pt-3">
          <div class="text-xs font-semibold text-bunker-muted mb-2">2. Исключить конкретные варианты (из выбранного пака):</div>
          <select onchange="openLobbyFilterModal(this.value)" class="w-full px-3 py-2 rounded-xl bg-bunker-bg border border-bunker-border text-xs text-white mb-2.5">
            ${TRAIT_META.map(m => `<option value="${m.key}" ${m.key === selectedKey ? 'selected' : ''}>${m.label}</option>`).join("")}
          </select>
          <div class="max-h-48 overflow-y-auto space-y-1 pr-1 mb-3">
            ${pool.length > 0 ? pool.map((item, idx) => `
              <label class="flex items-center gap-2 p-1.5 rounded-lg bg-bunker-bg border border-bunker-border/50 text-xs text-gray-200 cursor-pointer">
                <input type="checkbox" ${!excludedSet.has(item) ? 'checked' : ''} onchange="toggleSessionExclude('${selectedKey}', ${idx}, '${encodeURIComponent(item)}')" class="rounded bg-bunker-card border-bunker-border text-amber-500">
                <span>${item}</span>
              </label>
            `).join("") : '<div class="text-xs text-bunker-muted py-2">В этой категории нет вариантов для фильтрации</div>'}
          </div>
        </div>

        <button onclick="closeModal(); render();" class="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold text-sm">Готово</button>
      `);
    }

    function toggleLobbyTrait(key) {
      const room = state.room;
      if (!room.disabledTraits) room.disabledTraits = [];
      const idx = room.disabledTraits.indexOf(key);
      if (idx >= 0) room.disabledTraits.splice(idx, 1);
      else room.disabledTraits.push(key);
      saveRoomLocal(room);
    }

    function toggleSessionExclude(key, idx, encodedItem) {
      const room = state.room;
      if (!room.sessionExcluded) room.sessionExcluded = {};
      const item = decodeURIComponent(encodedItem);
      const arr = room.sessionExcluded[key] || [];
      const pos = arr.indexOf(item);
      if (pos >= 0) arr.splice(pos, 1);
      else arr.push(item);
      room.sessionExcluded[key] = arr;
      saveRoomLocal(room);
    }

    function selectRoomPack(packId) {
      if (!state.room || state.room.hostId !== CLIENT_ID) return;
      state.room.selectedPackId = packId;
      saveRoomLocal(state.room);
      render();
    }

    function getPlayingParticipants(room) {
      return room.players.filter(p => room.hostPlays || !p.isHost);
    }

    function startGame() {
      const room = state.room;
      if (!room) return;
      const participants = getPlayingParticipants(room);
      if (participants.length < 3) {
        showToast("Для игры нужно минимум 3 играющих участника", "warn");
        return;
      }

      const customPack = room.selectedPackId !== "base"
        ? state.customPacks.find(p => p.id === room.selectedPackId)
        : null;

      const baseCat = pick(DECKS.catastrophes);
      room.catastrophe = {
        title: (customPack && customPack.catastropheTitle) ? customPack.catastropheTitle : baseCat.title,
        desc: (customPack && customPack.catastropheDesc) ? customPack.catastropheDesc : baseCat.desc,
        duration: (customPack && customPack.duration) ? customPack.duration : baseCat.duration,
        packName: customPack ? customPack.name : "Базовый пак"
      };

      room.bunker = {
        area: (customPack && customPack.bunkerArea) ? customPack.bunkerArea : pick(DECKS.bunkerSpecs.areas),
        location: (customPack && customPack.bunkerLocation) ? customPack.bunkerLocation : pick(DECKS.bunkerSpecs.locations),
        rooms: (customPack && customPack.bunkerRooms) ? customPack.bunkerRooms : pick(DECKS.bunkerSpecs.rooms),
        food: (customPack && customPack.bunkerFood) ? customPack.bunkerFood : pick(DECKS.bunkerSpecs.food),
        features: (customPack && customPack.bunkerFeatures && customPack.bunkerFeatures.length > 0)
          ? customPack.bunkerFeatures
          : pickMultiple(DECKS.bunkerSpecs.features, 4)
      };

      room.players.forEach(p => {
        p.exiled = false;
        p.immunity = false;
        p.doubleVote = false;
        if (!room.hostPlays && p.isHost) {
          p.character = null;
        } else {
          p.character = createCharacter(customPack, room.sessionExcluded || {});
          if (p.isBot) p.character.revealed.profession = true;
        }
      });

      room.phase = "playing";
      room.round = 1;
      room.startedAt = Date.now();
      room.eventPool = (customPack && customPack.onlyCustom)
        ? (customPack.customEvents || [])
        : ((customPack && customPack.customEvents && customPack.customEvents.length > 0) ? [...customPack.customEvents, ...DECKS.events] : DECKS.events);
      room.timer = { seconds: 60, running: false, speakerId: participants[0].id };
      room.voting = { active: false, votes: {}, lastResult: null };
      room.log.unshift(`Игра началась! Пак: «${room.catastrophe.packName}».`);
      state.screen = "game";
      state.activeTab = "table";
      saveRoomLocal(room);
      render();
    }

    // Speech Timer Controls (для ведущего)
    function applyRandomEvent(room) {
      const participants = getPlayingParticipants(room).filter(p => !p.exiled && p.character);
      if (room.eventPool && room.eventPool.length === 0) return "";
      const hasCustom = room.eventPool && room.eventPool !== DECKS.events && room.eventPool.length > 0;
      if (hasCustom && Math.random() < 0.7) {
        const txt = pick(room.eventPool);
        room.activeEvent = txt;
        room.log.unshift(txt);
        return txt;
      }

      const actions = ["reveal_random", "bunker_break", "bunker_find", "immunity_gift", "double_vote_gift", "worsen_health", "heal_player", "break_luggage", "new_phobia"];
      if (participants.length >= 2) actions.push("swap_backpacks");
      if (room.bunkerSlots < Math.max(1, participants.length - 1)) actions.push("extra_slot");
      if (room.bunkerSlots > 1) actions.push("shrink_slot");

      const act = pick(actions);
      let msg = "";

      if (act === "reveal_random" && participants.length > 0) {
        const target = pick(participants);
        const hidden = TRAIT_META.filter(m => !target.character.revealed[m.key]);
        if (hidden.length > 0) {
          const m = pick(hidden);
          target.character.revealed[m.key] = true;
          msg = `⚡ Скачок напряжения! У игрока ${target.name} случайно открылась карта «${m.label}»: ${target.character.traits[m.key]}`;
        }
      } else if (act === "bunker_break") {
        const issue = pick(["Засор главной вентиляции", "Короткое замыкание в коридоре", "Протечка трубы с водой", "Сломался замок санузла"]);
        room.bunker.features.push("⚠️ " + issue);
        msg = `⚡ Авария в бункере! Добавлена новая проблема: ${issue}.`;
      } else if (act === "bunker_find") {
        const item = pick(["Заначка тушёнки (10 банок)", "Аптечка с антибиотиками", "Ящик с инструментами", "Запасные фильтры для воды"]);
        room.bunker.features.push("✅ " + item);
        msg = `⚡ Тайник в стене! В бункере найдено: ${item}.`;
      } else if (act === "extra_slot") {
        room.bunkerSlots += 1;
        msg = `⚡ Расчистка завала! Открылся запасной отсек — мест в бункере стало больше (+1, всего ${room.bunkerSlots}).`;
      } else if (act === "shrink_slot") {
        room.bunkerSlots -= 1;
        msg = `⚡ Обвал в жилом крыле! Часть отсека завалена — мест в бункере стало меньше (-1, всего ${room.bunkerSlots}).`;
      } else if (act === "immunity_gift" && participants.length > 0) {
        const target = pick(participants);
        target.immunity = true;
        msg = `⚡ Счастливый билет! Игрок ${target.name} нашёл пропуск и получил иммунитет на ближайшее голосование.`;
      } else if (act === "double_vote_gift" && participants.length > 0) {
        const target = pick(participants);
        target.doubleVote = true;
        msg = `⚡ Находка компромата! У игрока ${target.name} двойной голос на следующем голосовании.`;
      } else if (act === "worsen_health" && participants.length > 0) {
        const target = pick(participants);
        const newH = generateDefaultHealth();
        target.character.traits.health = newH;
        target.character.revealed.health = true;
        msg = `⚡ Вспышка инфекции в бункере! У ${target.name} ухудшилось здоровье: ${newH}.`;
      } else if (act === "heal_player" && participants.length > 0) {
        const target = pick(participants);
        target.character.traits.health = "Полностью здоров (вылечен событием)";
        target.character.revealed.health = true;
        msg = `⚡ Неожиданное спасение! ${target.name} нашёл редкий антибиотик и полностью вылечился!`;
      } else if (act === "break_luggage" && participants.length > 0) {
        const target = pick(participants);
        target.character.traits.bigLuggage = "Сломанный хлам (уничтожен аварией)";
        target.character.revealed.bigLuggage = true;
        msg = `⚡ Потоп в кладовой! У ${target.name} испорчен Большой багаж!`;
      } else if (act === "new_phobia" && participants.length > 0) {
        const target = pick(participants);
        const ph = pick(DECKS.phobias);
        target.character.traits.phobia = ph;
        target.character.revealed.phobia = true;
        msg = `⚡ Психологический срыв! У ${target.name} проявилась фобия: ${ph}.`;
      } else if (act === "swap_backpacks" && participants.length >= 2) {
        const pair = pickMultiple(participants, 2);
        const tmp = pair[0].character.traits.backpack;
        pair[0].character.traits.backpack = pair[1].character.traits.backpack;
        pair[1].character.traits.backpack = tmp;
        pair[0].character.revealed.backpack = true;
        pair[1].character.revealed.backpack = true;
        msg = `⚡ Перепутанные сумки! ${pair[0].name} и ${pair[1].name} обменялись рюкзаками (и они открылись на столе).`;
      }

      if (!msg) msg = pick(DECKS.events);
      room.activeEvent = msg;
      room.log.unshift(msg);
      return msg;
    }

    function triggerRandomEvent(isAuto = false) {
      const room = state.room;
      if (!room || room.hostId !== CLIENT_ID) return;
      applyRandomEvent(room);
      saveRoomLocal(room);
      showToast(isAuto ? "⚡ Внезапное событие в бункере!" : "Случайное событие сработало!", "warn");
      render();
    }

    function formatElapsed(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const sec = totalSec % 60;
      const mm = (m < 10 ? "0" : "") + m;
      const ss = (sec < 10 ? "0" : "") + sec;
      return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
    }

    function toggleTimer() {
      const room = state.room;
      if (!room || room.hostId !== CLIENT_ID) return;
      room.timer.running = !room.timer.running;
      if (timerInterval) clearInterval(timerInterval);
      if (room.timer.running) {
        timerInterval = setInterval(() => {
          if (!state.room || !state.room.timer.running) {
            clearInterval(timerInterval);
            return;
          }
          if (state.room.timer.seconds > 0) {
            state.room.timer.seconds -= 1;
            const el = document.getElementById("speech-timer-val");
            if (el) el.textContent = formatTime(state.room.timer.seconds);
            if (state.room.timer.seconds === 0) {
              state.room.timer.running = false;
              clearInterval(timerInterval);
              showToast("Время выступления вышло!", "warn");
              saveRoomLocal(state.room);
              render();
            }
          }
        }, 1000);
      }
      saveRoomLocal(room);
      render();
    }

    function resetTimer(sec = 60) {
      const room = state.room;
      if (!room || room.hostId !== CLIENT_ID) return;
      if (timerInterval) clearInterval(timerInterval);
      room.timer.running = false;
      room.timer.seconds = sec;
      saveRoomLocal(room);
      render();
    }

    function setSpeaker(pid) {
      const room = state.room;
      if (!room || room.hostId !== CLIENT_ID) return;
      room.timer.speakerId = pid;
      room.timer.seconds = 60;
      room.timer.running = false;
      if (timerInterval) clearInterval(timerInterval);
      saveRoomLocal(room);
      render();
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${s < 10 ? "0" : ""}${s}`;
    }

    function revealTrait(playerId, traitKey) {
      const room = state.room;
      const player = room.players.find(p => p.id === playerId);
      if (!player || player.exiled || !player.character || player.character.revealed[traitKey]) return;

      player.character.revealed[traitKey] = true;
      const meta = TRAIT_META.find(t => t.key === traitKey);
      room.log.unshift(`${player.name} открыл(а) «${meta.label}»: ${player.character.traits[traitKey]}`);

      getPlayingParticipants(room).filter(p => p.isBot && !p.exiled).forEach(bot => {
        const hiddenKeys = TRAIT_META.map(t => t.key).filter(k => !bot.character.revealed[k]);
        if (hiddenKeys.length > 0 && Math.random() < 0.45) {
          bot.character.revealed[pick(hiddenKeys)] = true;
        }
      });

      if (room.hostId === CLIENT_ID && Math.random() < 0.22) {
        applyRandomEvent(room);
        showToast("⚡ Внезапное событие в бункере!", "warn");
      }
      saveRoomLocal(room);
      showToast(`Открыто: «${meta.label}»`, "success");
      render();
    }

    function isTraitAbilityUsed(char, key) {
      if (char.traitAbilitiesUsed && char.traitAbilitiesUsed[key]) return true;
      if (key === "profession" && char.profAbilityUsed) return true;
      if (key === "hobby" && char.hobbyAbilityUsed) return true;
      return false;
    }

    function markTraitAbilityUsed(char, key) {
      if (!char.traitAbilitiesUsed) char.traitAbilitiesUsed = {};
      char.traitAbilitiesUsed[key] = true;
      if (key === "profession") char.profAbilityUsed = true;
      if (key === "hobby") char.hobbyAbilityUsed = true;
    }

    function displayTraitText(val) {
      if (!val) return "";
      const idx = val.indexOf("|");
      return idx >= 0 ? val.slice(0, idx).trim() : val;
    }

    function getTraitAbility(type, val) {
      if (val && val.includes("|")) {
        const rawAb = val.split("|").slice(1).join("|").replace(/\([^)]*\)\s*$/, "").trim();
        if (rawAb) {
          return { title: rawAb.slice(0, 28), desc: rawAb, action: "custom_trait_ab", customText: rawAb };
        }
      }
      const v = (val || "").toLowerCase();
      if (type === "profession") {
        if (v.includes("кукловод")) return { title: "Нити кукловода", desc: "Выберите игрока — он станет вашим заклятым врагом (в бункер пройдёт только один).", action: "rival" };
        if (v.includes("пират")) return { title: "Абордаж", desc: "Забирает Рюкзак у выбранного игрока себе.", action: "steal_backpack" };
        if (v.includes("шарлатан")) return { title: "Афера века", desc: "Забирает Большой багаж у выбранного игрока себе.", action: "steal_big" };
        if (v.includes("вампир")) return { title: "Укус вампира", desc: "Омолаживает выбранного игрока (меняет возраст на 19 лет).", action: "vampire_bite" };
        if (v.includes("хирург") || v.includes("медик") || v.includes("фармацевт")) return { title: "Полевая операция", desc: "Полностью излечивает выбранного игрока.", action: "heal_target" };
        if (v.includes("палач") || v.includes("маньяк") || v.includes("ассасин") || v.includes("взломщик")) return { title: "Допрос", desc: "Принудительно открывает случайную закрытую карту выбранного игрока.", action: "reveal_target" };
        if (v.includes("документовед")) return { title: "Архив", desc: "Раскрывает «Доп. сведение» выбранного игрока.", action: "reveal_fact" };
        if (v.includes("нотариус")) return { title: "Печать нотариуса", desc: "Добавляет +1 дополнительный голос (двойной голос) на следующем голосовании.", action: "self_double_vote" };
        if (v.includes("ортопед")) return { title: "Ортопедия", desc: "Снижает степень болезни выбранного игрока до «Легкая».", action: "soften_health" };
        if (v.includes("пожарный")) return { title: "Экипировка", desc: "Добавляет вам в Большой багаж «Защитный костюм».", action: "add_suit" };
        if (v.includes("парамедик")) return { title: "Реанимация", desc: "Возвращает изгнанного игрока обратно в игру!", action: "revive_exiled" };
        if (v.includes("доярка") || v.includes("фермер")) return { title: "Ферма (Корова)", desc: "Добавляет вам в Большой багаж живую «Корову».", action: "add_cow" };
        if (v.includes("спортсмен")) return { title: "Прокачка", desc: "Меняет ваше телосложение на «Атлетическое».", action: "make_athletic" };
      }
      if (type === "hobby") {
        if (v.includes("травничество") || v.includes("первая помощь") || v.includes("йога")) return { title: "Целебный отвар", desc: "Снижает степень болезни выбранного игрока до «Легкая».", action: "soften_health" };
        if (v.includes("бинокль") || v.includes("wi-fi") || v.includes("сталкер") || v.includes("магия")) return { title: "Слежка", desc: "Подсматривает и открывает случайную закрытую карту выбранного игрока.", action: "reveal_target" };
        if (v.includes("стрельба") || v.includes("ножей")) return { title: "Отжим", desc: "Забирает Рюкзак у выбранного игрока.", action: "steal_backpack" };
      }
      return null;
    }

    function applyCustomTraitAddItem(playerId, type) {
      const room = state.room;
      const player = room.players.find(p => p.id === playerId);
      const slot = document.getElementById("cta-slot").value;
      const item = document.getElementById("cta-item").value.trim();
      if (!item || !player) { showToast("Введите предмет", "warn"); return; }

      player.character.traits[slot] = `${player.character.traits[slot]} + ${item}`;
      player.character.revealed[slot] = true;
      markTraitAbilityUsed(player.character, type);
      player.character.revealed[type] = true;
      const msg = `⚡ ${player.name} (${displayTraitText(player.character.traits[type])}) добавил(а) себе: ${item}!`;
      room.log.unshift(msg);
      room.activeEvent = msg;
      closeModal();
      saveRoomLocal(room);
      showToast(`Добавлено: ${item}!`, "success");
      render();
    }

    function useTraitAbility(playerId, type) {
      const room = state.room;
      const player = room.players.find(p => p.id === playerId);
      if (!player || player.exiled || !player.character) return;
      if (isTraitAbilityUsed(player.character, type)) return;

      const ab = getTraitAbility(type, player.character.traits[type]);
      if (!ab) return;

      if (ab.action === "self_double_vote") {
        player.doubleVote = true;
        markTraitAbilityUsed(player.character, type);
        player.character.revealed[type] = true;
        const msg = `📜 ${player.name} (${ab.title}) заверил себе двойной голос на следующее голосование!`;
        room.log.unshift(msg);
        room.activeEvent = msg;
        saveRoomLocal(room);
        showToast("Двойной голос активирован!", "success");
        render();
        return;
      }
      if (ab.action === "add_cow") {
        player.character.traits.bigLuggage = `${player.character.traits.bigLuggage} + Живая корова`;
        player.character.revealed.bigLuggage = true;
        markTraitAbilityUsed(player.character, type);
        player.character.revealed[type] = true;
        const msg = `🐄 ${player.name} (${ab.title}) привёл в бункер живую корову!`;
        room.log.unshift(msg);
        room.activeEvent = msg;
        saveRoomLocal(room);
        showToast("Корова добавлена в Большой багаж!", "success");
        render();
        return;
      }
      if (ab.action === "make_athletic") {
        const hPart = player.character.traits.body.includes(",") ? player.character.traits.body.slice(player.character.traits.body.indexOf(",")) : "";
        player.character.traits.body = `Атлетическое${hPart}`;
        player.character.revealed.body = true;
        markTraitAbilityUsed(player.character, type);
        player.character.revealed[type] = true;
        const msg = `💪 ${player.name} (${ab.title}) стал Атлетического телосложения!`;
        room.log.unshift(msg);
        room.activeEvent = msg;
        saveRoomLocal(room);
        showToast("Телосложение изменено на Атлетическое!", "success");
        render();
        return;
      }
      if (ab.action === "revive_exiled") {
        const exiledList = getPlayingParticipants(room).filter(p => p.exiled);
        if (exiledList.length === 0) {
          showToast("Пока нет изгнанных игроков для возврата", "warn");
          return;
        }
        openModal(`
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-lg font-bold text-white">🩺 ${ab.title}</h3>
            <button onclick="closeModal()" class="text-bunker-muted hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <p class="text-sm text-bunker-muted mb-4">Выберите изгнанного игрока, чтобы вернуть его обратно в бункер:</p>
          <div class="space-y-2">
            ${exiledList.map(t => `
              <button onclick="applyTraitAbilityTarget('${playerId}', '${type}', '${t.id}')" class="w-full text-left px-4 py-3 rounded-xl bg-bunker-card hover:bg-bunker-border border border-bunker-border text-sm font-medium flex items-center justify-between transition">
                <span>${t.name}</span>
                <span class="text-xs text-emerald-400">Вернуть в игру</span>
              </button>
            `).join("")}
          </div>
        `);
        return;
      }
      if (ab.action === "add_suit") {
        player.character.traits.bigLuggage = `${player.character.traits.bigLuggage} + Защитный костюм`;
        player.character.revealed.bigLuggage = true;
        markTraitAbilityUsed(player.character, type);
        player.character.revealed[type] = true;
        const msg = `🚒 ${player.name} (${ab.title}) добавил себе в Большой багаж «Защитный костюм»!`;
        room.log.unshift(msg);
        room.activeEvent = msg;
        saveRoomLocal(room);
        showToast("Защитный костюм добавлен!", "success");
        render();
        return;
      }

      if (ab.action === "custom_trait_ab") {
        const lower = ab.customText.toLowerCase();
        const isAddItem = lower.includes("добав") || lower.includes("коров") || lower.includes("багаж") || lower.includes("рюкзак") || lower.includes("инвентар") || lower.includes("предмет");
        if (isAddItem) {
          const defaultSlot = lower.includes("рюкзак") ? "backpack" : "bigLuggage";
          const suggested = ab.customText.replace(/добавить( в (большой )?багаж| в рюкзак| в инвентарь| себе)?/gi, "").replace(/[:—-]/g, "").trim();
          openModal(`
            <div class="flex items-center justify-between mb-3">
              <h3 class="text-lg font-bold text-white">⚡ ${ab.title}</h3>
              <button onclick="closeModal()" class="text-bunker-muted hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <p class="text-xs text-bunker-muted mb-3">${ab.desc}</p>
            <div class="space-y-3 mb-4">
              <select id="cta-slot" class="w-full px-3 py-2.5 rounded-xl bg-bunker-bg border border-bunker-border text-sm text-white">
                <option value="bigLuggage" ${defaultSlot === 'bigLuggage' ? 'selected' : ''}>Большой багаж</option>
                <option value="backpack" ${defaultSlot === 'backpack' ? 'selected' : ''}>Рюкзак</option>
              </select>
              <input id="cta-item" type="text" value="${suggested}" placeholder="Что добавить?" class="w-full px-3 py-2.5 rounded-xl bg-bunker-bg border border-bunker-border text-sm text-white">
            </div>
            <button onclick="applyCustomTraitAddItem('${playerId}', '${type}')" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-sm">Добавить себе</button>
          `);
          return;
        }
        // Otherwise apply as instant announcement/action
        markTraitAbilityUsed(player.character, type);
        player.character.revealed[type] = true;
        const msg = `⚡ ${player.name} (${displayTraitText(player.character.traits[type])}) применил(а) способность: ${ab.customText}`;
        room.log.unshift(msg);
        room.activeEvent = msg;
        saveRoomLocal(room);
        showToast("Способность применена!", "success");
        render();
        return;
      }

      const targets = getPlayingParticipants(room).filter(p => !p.exiled && p.id !== playerId);
      if (targets.length === 0) return;

      openModal(`
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-lg font-bold text-white flex items-center gap-2">
            <i data-lucide="zap" class="w-5 h-5 text-amber-400"></i>
            ${ab.title}
          </h3>
          <button onclick="closeModal()" class="text-bunker-muted hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <p class="text-sm text-bunker-muted mb-4">${ab.desc}</p>
        <div class="space-y-2">
          ${targets.map(t => `
            <button onclick="applyTraitAbilityTarget('${playerId}', '${type}', '${t.id}')" class="w-full text-left px-4 py-3 rounded-xl bg-bunker-card hover:bg-bunker-border border border-bunker-border text-sm font-medium flex items-center justify-between transition">
              <span>${t.name}</span>
              <span class="text-xs text-amber-400">Применить</span>
            </button>
          `).join("")}
        </div>
      `);
    }

    function applyTraitAbilityTarget(playerId, type, targetId) {
      const room = state.room;
      const player = room.players.find(p => p.id === playerId);
      const target = room.players.find(p => p.id === targetId);
      if (!player || !target) return;

      const ab = getTraitAbility(type, player.character.traits[type]);
      closeModal();

      if (ab.action === "rival") {
        player.rivalName = target.name;
        target.rivalName = player.name;
        room.log.unshift(`⚔️ ${player.name} (${ab.title}) сделал ${target.name} своим врагом — в бункер пройдёт только один!`);
        showToast(`${target.name} теперь ваш враг!`, "warn");
      } else if (ab.action === "steal_backpack") {
        const stolen = target.character.traits.backpack;
        player.character.traits.backpack = `${player.character.traits.backpack} + ${stolen}`;
        target.character.traits.backpack = "Пусто (ограблен)";
        player.character.revealed.backpack = true;
        target.character.revealed.backpack = true;
        room.log.unshift(`🏴‍☠️ ${player.name} (${ab.title}) забрал рюкзак у ${target.name}: ${stolen}!`);
        showToast(`Вы забрали рюкзак у ${target.name}!`, "success");
      } else if (ab.action === "steal_big") {
        const stolen = target.character.traits.bigLuggage;
        player.character.traits.bigLuggage = stolen;
        target.character.traits.bigLuggage = "Пусто (украдено)";
        player.character.revealed.bigLuggage = true;
        target.character.revealed.bigLuggage = true;
        room.log.unshift(`🎭 ${player.name} (${ab.title}) украл Большой багаж у ${target.name}: ${stolen}!`);
        showToast(`Вы украли багаж у ${target.name}!`, "success");
      } else if (ab.action === "vampire_bite") {
        const gBase = target.character.traits.gender.split(",")[0].trim();
        target.character.traits.gender = `${gBase}, 19 лет (укушен вампиром)`;
        target.character.revealed.gender = true;
        room.log.unshift(`🧛 ${player.name} укусил ${target.name} — теперь ему 19 лет!`);
        showToast(`${target.name} омолодился до 19 лет!`, "success");
      } else if (ab.action === "heal_target") {
        target.character.traits.health = "Полностью здоров (вылечен)";
        target.character.revealed.health = true;
        room.log.unshift(`🩺 ${player.name} (${ab.title}) полностью вылечил ${target.name}!`);
        showToast(`${target.name} теперь полностью здоров!`, "success");
      } else if (ab.action === "soften_health") {
        const h = target.character.traits.health;
        if (!h.includes("Полностью здоров")) {
          const base = h.split("(")[0].trim();
          target.character.traits.health = `${base} (Легкая)`;
          target.character.revealed.health = true;
        }
        room.log.unshift(`🌿 ${player.name} (${ab.title}) облегчил болезнь у ${target.name}!`);
        showToast(`Болезнь ${target.name} снижена до лёгкой!`, "success");
      } else if (ab.action === "revive_exiled") {
        target.exiled = false;
        room.log.unshift(`🩺 ${player.name} (Парамедик) реанимировал и вернул в игру ${target.name}!`);
        showToast(`${target.name} возвращён в игру!`, "success");
      } else if (ab.action === "reveal_fact") {
        target.character.revealed.fact = true;
        room.log.unshift(`📂 ${player.name} (${ab.title}) раскрыл Доп. сведение у ${target.name}: ${target.character.traits.fact}`);
        showToast(`У ${target.name} открыто Доп. сведение!`, "success");
      } else if (ab.action === "reveal_target") {
        const hidden = TRAIT_META.map(m => m.key).filter(k => !target.character.revealed[k]);
        if (hidden.length > 0) {
          const k = pick(hidden);
          target.character.revealed[k] = true;
          const label = TRAIT_META.find(m => m.key === k).label;
          room.log.unshift(`🔍 ${player.name} (${ab.title}) раскрыл карту «${label}» у ${target.name}: ${target.character.traits[k]}`);
          showToast(`У ${target.name} открыто: ${label}`, "success");
        }
      }

      room.activeEvent = room.log[0];
      markTraitAbilityUsed(player.character, type);
      player.character.revealed[type] = true;
      saveRoomLocal(room);
      render();
    }

    function useSpecialCard(playerId, idx) {
      const room = state.room;
      const player = room.players.find(p => p.id === playerId);
      if (!player || player.exiled || !player.character) return;
      const card = player.character.specials[idx];
      if (!card || card.used) return;
      const aliveOthers = getPlayingParticipants(room).filter(p => !p.exiled && p.id !== playerId);

      if (card.actionType === "self_heal") {
        player.character.traits.health = "Полностью здоров (вылечен)";
        player.character.revealed.health = true;
        card.used = true;
        room.log.unshift(`${player.name} использовал(а) «${card.title}»!`);
        saveRoomLocal(room);
        showToast("Здоровье восстановлено!", "success");
        render();
      } else if (card.actionType === "reroll_prof") {
        player.character.traits.profession = `${pick(DECKS.professions)} (${pick(PROF_EXP)})`;
        player.character.revealed.profession = true;
        card.used = true;
        room.log.unshift(`${player.name} сменил(а) профессию!`);
        saveRoomLocal(room);
        showToast("Профессия изменена!", "success");
        render();
      } else if (card.actionType === "reroll_health") {
        player.character.traits.health = generateDefaultHealth();
        player.character.revealed.health = true;
        card.used = true;
        room.log.unshift(`${player.name} обновил(а) здоровье!`);
        saveRoomLocal(room);
        showToast("Карта здоровья обновлена!", "success");
        render();
      } else if (card.actionType === "double_vote") {
        player.doubleVote = true;
        card.used = true;
        room.log.unshift(`${player.name} активировал(а) двойной голос!`);
        saveRoomLocal(room);
        showToast("Двойной голос активирован!", "success");
        render();
      } else if (card.actionType === "immunity") {
        player.immunity = true;
        card.used = true;
        room.log.unshift(`${player.name} получил(а) иммунитет на раунд!`);
        saveRoomLocal(room);
        showToast("Иммунитет активирован!", "success");
        render();
      } else if (card.actionType === "shrink_slot") {
        if (room.bunkerSlots > 1) room.bunkerSlots -= 1;
        card.used = true;
        room.log.unshift(`${player.name} уменьшил(а) бункер на -1 место (теперь ${room.bunkerSlots}).`);
        saveRoomLocal(room);
        showToast(`Мест в бункере стало меньше: ${room.bunkerSlots}`, "warn");
        render();
      } else if (card.actionType === "orator_all") {
        getPlayingParticipants(room).filter(p => !p.exiled && p.character).forEach(p => {
          p.character.traits.fact = `${p.character.traits.fact} + Курс ораторского мастерства`;
          p.character.revealed.fact = true;
        });
        card.used = true;
        room.log.unshift(`${player.name} применил(а) «Курс ораторского мастерства» для всех игроков!`);
        saveRoomLocal(room);
        showToast("Все игроки получили курс ораторского мастерства!", "success");
        render();
      } else if (card.actionType === "reveal_all_phobias") {
        getPlayingParticipants(room).filter(p => !p.exiled && p.character).forEach(p => {
          p.character.revealed.phobia = true;
        });
        card.used = true;
        room.log.unshift(`${player.name} вызвал(а) «Групповую панику» — у всех открыты Фобии!`);
        saveRoomLocal(room);
        showToast("У всех игроков открыты фобии!", "warn");
        render();
      } else if (card.actionType === "add_slot") {
        const maxSlots = getPlayingParticipants(room).length - 1;
        room.bunkerSlots = Math.min(maxSlots, room.bunkerSlots + 1);
        card.used = true;
        room.log.unshift(`${player.name} расширил(а) бункер (+1 место)!`);
        saveRoomLocal(room);
        showToast("Вместимость бункера увеличена на +1!", "success");
        render();
      } else if (card.actionType === "custom_phobia") {
        openModal(`
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-lg font-bold text-white">${card.title}</h3>
            <button onclick="closeModal()" class="text-bunker-muted hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <p class="text-sm text-bunker-muted mb-4">${card.desc}</p>
          <div class="space-y-3 mb-4">
            <div>
              <label class="block text-xs text-gray-300 mb-1">Ваша новая фобия / страх</label>
              <input id="cp-text" type="text" placeholder="Например: Боязнь ящика копчёной колбасы" class="w-full px-3 py-2.5 rounded-xl bg-bunker-bg border border-bunker-border text-sm text-white">
            </div>
            <label class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer">
              <input id="cp-reveal" type="checkbox" checked class="rounded bg-bunker-bg border-bunker-border text-amber-500">
              Сразу открыть для всех на общем столе
            </label>
          </div>
          <button onclick="applyCustomPhobia('${playerId}', ${idx})" class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold text-sm transition">
            Изменить фобию
          </button>
        `);
      } else if (card.actionType === "custom_fact_target") {
        if (aliveOthers.length === 0) return;
        openModal(`
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-lg font-bold text-white">${card.title}</h3>
            <button onclick="closeModal()" class="text-bunker-muted hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <p class="text-sm text-bunker-muted mb-4">${card.desc}</p>
          <div class="space-y-3 mb-4">
            <select id="cft-target" class="w-full px-3 py-2.5 rounded-xl bg-bunker-bg border border-bunker-border text-sm text-white">
              ${aliveOthers.map(t => `<option value="${t.id}">${t.name}</option>`).join("")}
            </select>
            <input id="cft-text" type="text" placeholder="Например: Он на самом деле киборг" class="w-full px-3 py-2.5 rounded-xl bg-bunker-bg border border-bunker-border text-sm text-white">
          </div>
          <button onclick="applyCustomFactTarget('${playerId}', ${idx})" class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold text-sm">Применить</button>
        `);
      } else if (card.actionType === "d20_fact" || card.actionType === "d20_steal") {
        const needsTarget = card.actionType === "d20_steal";
        if (needsTarget && aliveOthers.length === 0) return;
        openModal(`
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-lg font-bold text-white flex items-center gap-2">
              <i data-lucide="dices" class="w-5 h-5 text-amber-400"></i>
              ${card.title}
            </h3>
            <button onclick="closeModal()" class="text-bunker-muted hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <p class="text-sm text-bunker-muted mb-4">${card.desc}</p>
          ${needsTarget ? `
            <div class="mb-4">
              <label class="block text-xs text-gray-300 mb-1">У кого крадём?</label>
              <select id="d20-target" class="w-full px-3 py-2.5 rounded-xl bg-bunker-bg border border-bunker-border text-sm text-white">
                ${aliveOthers.map(t => `<option value="${t.id}">${t.name}</option>`).join("")}
              </select>
            </div>
          ` : ''}
          <div class="text-xs font-semibold text-gray-300 mb-2">Выберите ставку и бросьте d20:</div>
          <div class="grid grid-cols-2 gap-3">
            <button onclick="rollD20Special('${playerId}', ${idx}, 'even')" class="py-3.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold text-sm transition">Чётное</button>
            <button onclick="rollD20Special('${playerId}', ${idx}, 'odd')" class="py-3.5 rounded-xl bg-bunker-card hover:bg-bunker-border border border-amber-500/40 text-amber-300 font-bold text-sm transition">Нечётное</button>
          </div>
        `);
      } else if (card.actionType === "add_custom_item") {
        openModal(`
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-lg font-bold text-white">${card.title}</h3>
            <button onclick="closeModal()" class="text-bunker-muted hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <p class="text-sm text-bunker-muted mb-4">${card.desc}</p>
          <div class="space-y-3 mb-4">
            <div>
              <label class="block text-xs text-gray-300 mb-1">Куда добавить?</label>
              <select id="ci-slot" class="w-full px-3 py-2.5 rounded-xl bg-bunker-bg border border-bunker-border text-sm text-white">
                <option value="backpack">Рюкзак</option>
                <option value="bigLuggage">Большой багаж</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-gray-300 mb-1">Название предмета</label>
              <input id="ci-text" type="text" placeholder="Например: Генератор или аптечка" class="w-full px-3 py-2.5 rounded-xl bg-bunker-bg border border-bunker-border text-sm text-white">
            </div>
            <label class="flex items-center gap-2 text-xs text-gray-300 cursor-pointer">
              <input id="ci-reveal" type="checkbox" checked class="rounded bg-bunker-bg border-bunker-border text-amber-500">
              Сразу открыть для всех
            </label>
          </div>
          <button onclick="applyCustomItem('${playerId}', ${idx})" class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold text-sm transition">
            Добавить предмет
          </button>
        `);
      } else if (card.actionType === "force_reveal" || card.actionType === "swap_big_luggage" || card.actionType === "swap_prof" || card.actionType === "swap_health" || card.actionType === "heal_other" || card.actionType === "infect_other" || card.actionType === "strip_immunity" || card.actionType === "werewolf_bite" || card.actionType === "give_phobia" || card.actionType === "change_health_deg" || card.actionType === "flip_gender" || card.actionType === "make_childfree" || card.actionType === "remove_childfree" || card.actionType === "swap_body") {
        if (aliveOthers.length === 0) return;
        openModal(`
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-lg font-bold text-white">${card.title}</h3>
            <button onclick="closeModal()" class="text-bunker-muted hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <p class="text-sm text-bunker-muted mb-4">${card.desc}</p>
          <div class="space-y-2">
            ${aliveOthers.map(t => `
              <button onclick="applyTargetSpecial('${playerId}', ${idx}, '${t.id}')" class="w-full text-left px-4 py-3 rounded-xl bg-bunker-card hover:bg-bunker-border border border-bunker-border text-sm font-medium flex items-center justify-between transition">
                <span>${t.name}</span>
                <span class="text-xs text-amber-400">Выбрать</span>
              </button>
            `).join("")}
          </div>
        `);
      }
    }

    function openFreeDiceModal() {
      openModal(`
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-lg font-bold text-white flex items-center gap-2">
            <i data-lucide="dices" class="w-5 h-5 text-amber-400"></i>
            Бросок кубика для всех
          </h3>
          <button onclick="closeModal()" class="text-bunker-muted hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <p class="text-xs text-bunker-muted mb-4">Результат броска сразу увидят все игроки в комнате — для споров, проверок удачи и отыгрыша.</p>
        <div class="grid grid-cols-2 gap-2.5 mb-3">
          <button onclick="rollFreeDice(6)" class="py-3.5 rounded-xl bg-bunker-card hover:bg-amber-500 hover:text-black border border-bunker-border font-mono font-bold text-sm transition">🎲 d6 (1–6)</button>
          <button onclick="rollFreeDice(10)" class="py-3.5 rounded-xl bg-bunker-card hover:bg-amber-500 hover:text-black border border-bunker-border font-mono font-bold text-sm transition">🎲 d10 (1–10)</button>
          <button onclick="rollFreeDice(20)" class="py-3.5 rounded-xl bg-amber-500/15 hover:bg-amber-500 hover:text-black border border-amber-500/40 text-amber-300 font-mono font-bold text-sm transition">🎲 d20 (1–20)</button>
          <button onclick="rollFreeDice(100)" class="py-3.5 rounded-xl bg-bunker-card hover:bg-amber-500 hover:text-black border border-bunker-border font-mono font-bold text-sm transition">🎲 d100 (1–100)</button>
        </div>
        <button onclick="rollFreeCoin()" class="w-full py-3 rounded-xl bg-bunker-surface hover:bg-bunker-border border border-bunker-border text-sm font-semibold text-gray-200 transition">🪙 Подбросить монетку (Орёл / Решка)</button>
      `);
    }

    function rollFreeDice(sides) {
      const room = state.room;
      if (!room) return;
      const actor = room.players.find(p => p.id === state.viewingPlayerId) || room.players.find(p => p.id === CLIENT_ID) || { name: "Игрок" };
      const val = Math.floor(1 + Math.random() * sides);
      const parity = val % 2 === 0 ? "Чётное" : "Нечётное";
      const msg = `🎲 ${actor.name} бросил(а) d${sides} — выпало ${val} (${parity})`;
      room.activeEvent = msg;
      room.log.unshift(msg);
      closeModal();
      saveRoomLocal(room);
      showToast(`d${sides}: выпало ${val}!`, "info");
      render();
    }

    function rollFreeCoin() {
      const room = state.room;

    function rollD20Special(playerId, idx, guess) {
      const room = state.room;
      const player = room.players.find(p => p.id === playerId);
      const card = player.character.specials[idx];
      const roll = Math.floor(1 + Math.random() * 20);
      const isEven = roll % 2 === 0;
      const won = (guess === "even" && isEven) || (guess === "odd" && !isEven);
      const guessLabel = guess === "even" ? "Чётное" : "Нечётное";

      let msg = "";
      if (card.actionType === "d20_fact") {
        if (won) {
          const newFact = pick(DECKS.facts);
          player.character.traits.fact = `${player.character.traits.fact} + ${newFact}`;
          player.character.revealed.fact = true;
          msg = `🎲 ${player.name} поставил на ${guessLabel}, выпало ${roll}! Успех — добавлено Доп. сведение: ${newFact}`;
        } else {
          msg = `🎲 ${player.name} поставил на ${guessLabel}, выпало ${roll}. Не угадал — карта сгорела!`;
        }
      } else if (card.actionType === "d20_steal") {
        const targetId = document.getElementById("d20-target").value;
        const target = room.players.find(p => p.id === targetId);
        if (won && target) {
          const stolen = target.character.traits.bigLuggage;
          player.character.traits.bigLuggage = stolen;
          target.character.traits.bigLuggage = "Пусто (украдено через d20)";
          player.character.revealed.bigLuggage = true;
          target.character.revealed.bigLuggage = true;
          msg = `🎲 ${player.name} поставил на ${guessLabel}, выпало ${roll}! Успех — забрал Большой багаж у ${target.name}: ${stolen}`;
        } else {
          msg = `🎲 ${player.name} поставил на ${guessLabel}, выпало ${roll}. Кража у ${target ? target.name : 'игрока'} провалилась!`;
        }
      }

      card.used = true;
      room.log.unshift(msg);
      room.activeEvent = msg;
      closeModal();
      saveRoomLocal(room);
      showToast(`Выпало ${roll} — ${won ? 'Успех!' : 'Мимо!'}`, won ? "success" : "warn");
      render();
    }

    function startVoting() {
      const room = state.room;
      room.phase = "voting";
      room.voting = { active: true, votes: {}, lastResult: null };
      const alive = getPlayingParticipants(room).filter(p => !p.exiled);
      alive.filter(p => p.isBot).forEach(bot => {
        const candidates = alive.filter(c => c.id !== bot.id);
        if (candidates.length > 0) room.voting.votes[bot.id] = pick(candidates).id;
      });
      room.log.unshift(`Раунд ${room.round}: началось голосование!`);
      state.activeTab = "vote";
      saveRoomLocal(room);
      render();
    }

    function castVote(voterId, targetId) {
      if (!state.room || !state.room.voting.active) return;
      state.room.voting.votes[voterId] = targetId;
      saveRoomLocal(state.room);
      showToast("Голос учтён", "success");
      render();
    }

    function finishVoting() {
      const room = state.room;
      if (!room || !room.voting.active) return;
      const participants = getPlayingParticipants(room);
      const tally = {};
      participants.filter(p => !p.exiled).forEach(p => { tally[p.id] = 0; });

      Object.entries(room.voting.votes).forEach(([voterId, targetId]) => {
        const voter = participants.find(p => p.id === voterId);
        const target = participants.find(p => p.id === targetId);
        if (voter && !voter.exiled && target && !target.exiled && !target.immunity) {
          tally[targetId] = (tally[targetId] || 0) + (voter.doubleVote ? 2 : 1);
        }
      });

      let maxVotes = -1, leaders = [];
      Object.entries(tally).forEach(([pid, count]) => {
        if (count > maxVotes) { maxVotes = count; leaders = [pid]; }
        else if (count === maxVotes) leaders.push(pid);
      });

      const exiledId = leaders.length > 0 ? pick(leaders) : null;
      let resultText = "Никто не был изгнан.";
      if (exiledId && maxVotes > 0) {
        const ep = participants.find(p => p.id === exiledId);
        ep.exiled = true;
        resultText = `${ep.name} получил(а) ${maxVotes} голос(ов) и изгнан(а)!`;
      }

      room.log.unshift(resultText);
      participants.forEach(p => { p.immunity = false; p.doubleVote = false; });
      room.voting.active = false;
      room.voting.lastResult = resultText;
      room.round += 1;

      if (participants.filter(p => !p.exiled).length <= room.bunkerSlots) {
        room.phase = "gameover";
        state.screen = "gameover";
        participants.forEach(p => {
          if (p.character) TRAIT_META.forEach(t => { p.character.revealed[t.key] = true; });
        });
      } else {
        room.phase = "playing";
      }

      saveRoomLocal(room);
      showToast(resultText, "warn");
      render();
    }

    async function saveSupabaseSettings() {
      state.supabaseCfg = { url: document.getElementById("sb-url").value.trim(), key: document.getElementById("sb-key").value.trim() };
      try { localStorage.setItem(STORAGE_KEY_SUPABASE, JSON.stringify(state.supabaseCfg)); } catch (e) {}
      await initSupabaseIfConfigured();
      closeModal();
      showToast("Настройки сохранены", "success");
      render();
    }

    function clearSupabaseSettings() {
      state.supabaseCfg = { ...DEFAULT_SUPABASE_CFG };
      try { localStorage.removeItem(STORAGE_KEY_SUPABASE); } catch (e) {}
      closeModal();
      showToast("Восстановлены встроенные настройки", "info");

              <i data-lucide="users" class="w-5 h-5 text-amber-400"></i> Игроки (${room.players.length}/${room.maxPlayers || 12})

            <div class="space-y-2 mb-4">

                  ${isHost && !p.isHost ? `<button onclick="removePlayer('${p.id}')" class="p-1.5 text-bunker-muted hover:text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}

              `).join("")}
            </div>
            ${isHost ? `
              <div class="grid grid-cols-2 gap-2.5 pt-2 border-t border-bunker-border">
                <button onclick="addBotOrLocalPlayer(false)" class="py-2.5 px-3 rounded-xl bg-bunker-card hover:bg-bunker-border border border-bunker-border text-xs sm:text-sm font-medium text-gray-200 flex items-center justify-center gap-1.5">

                <button onclick="addBotOrLocalPlayer(true)" class="py-2.5 px-3 rounded-xl bg-bunker-card hover:bg-bunker-border border border-bunker-border text-xs sm:text-sm font-medium text-gray-200 flex items-center justify-center gap-1.5">
                  <i data-lucide="bot" class="w-4 h-4 text-emerald-400"></i> + Добавить бота
                </button>
              </div>
            ` : ''}
          </div>

          <div class="bg-bunker-surface border border-bunker-border rounded-2xl p-5 flex flex-col justify-between gap-4">
            <div class="space-y-4">
              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-bunker-muted mb-2">Пак характеристик</label>
                <select ${!isHost ? 'disabled' : ''} onchange="selectRoomPack(this.value)" class="w-full px-3 py-2.5 rounded-xl bg-bunker-bg border border-bunker-border text-sm text-white">
                  ${packOptions}

                ${isHost ? `
                  <div class="mt-2 flex flex-wrap gap-3">
                    <button onclick="state.screen='packs'; render();" class="text-xs text-amber-400 hover:underline inline-flex items-center gap-1"><i data-lucide="settings" class="w-3 h-3"></i> Личные паки</button>
                    <button onclick="openLobbyFilterModal()" class="text-xs text-emerald-400 hover:underline inline-flex items-center gap-1"><i data-lucide="sliders-horizontal" class="w-3 h-3"></i> Фильтр карт</button>

              ${isHost ? `
                <label class="flex items-center justify-between p-3 rounded-xl bg-bunker-card border border-bunker-border cursor-pointer">

          </div>
        </div>
      `;

    function renderGame() {
      const room = state.room;
      const isHost = room.hostId === CLIENT_ID;
      const participants = getPlayingParticipants(room);
      const aliveCount = participants.filter(p => !p.exiled).length;

      let currentPlayer = participants.find(p => p.id === state.viewingPlayerId) || participants[0];
      const localHumans = participants.filter(p => !p.isBot);
      const speaker = participants.find(p => p.id === room.timer.speakerId) || participants[0];

      return `
        <!-- Top Status + Speech Timer Bar -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
          <div class="md:col-span-2 bg-bunker-surface border border-bunker-border rounded-2xl p-3.5 flex items-center justify-between gap-3">
            <div class="cursor-pointer flex-1" onclick="state.catastropheExpanded = !state.catastropheExpanded; render();">
              <div class="text-[11px] font-mono uppercase text-red-400 flex flex-wrap items-center gap-2">
                <span class="inline-flex items-center gap-1"><i data-lucide="radiation" class="w-3.5 h-3.5"></i> Раунд ${room.round} • ${room.catastrophe.duration}</span>
                <span class="px-2 py-0.5 rounded bg-bunker-card border border-bunker-border text-gray-200 inline-flex items-center gap-1">
                  <i data-lucide="clock" class="w-3 h-3 text-amber-400"></i>
                  В игре: <span id="game-duration-val">${room.startedAt ? formatElapsed(Date.now() - room.startedAt) : '00:00'}</span>
                </span>
